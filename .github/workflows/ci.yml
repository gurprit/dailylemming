name: Test and build

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run lix:audit
      - run: npm run lix:vendor:first
      - run: npm run lix:inspect:characters
      - run: npm run test:real-lix
      - run: npm run lix:search
      - uses: actions/upload-artifact@v4
        with:
          name: lix-level-audit
          path: generated/lix/
      - run: npm run build
